# Sample pod that requests only the burst tier: cpi-idle-agent sets
# cpu.max.burst to the pod's CPU quota. Burst only takes effect when every
# container declares a positive limits.cpu (internal/tier.hasPositiveCPULimit),
# so this sample sets one.
apiVersion: v1
kind: Pod
metadata:
  name: sample-burst
  namespace: default
  labels:
    app.kubernetes.io/name: cpi-idle-sample
  annotations:
    cpu.azalio.net/burst: "true"
spec:
  restartPolicy: Never
  containers:
    - name: workload
      image: busybox:1.36
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      resources:
        requests:
          cpu: 500m
          memory: 32Mi
        limits:
          cpu: "1"
          memory: 64Mi
