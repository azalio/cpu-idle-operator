# Sample pod that requests only the idle tier: cpu-idle-agent sets
# cpu.idle=1 on this pod's cgroup once cpu-idle-agent observes it.
apiVersion: v1
kind: Pod
metadata:
  name: sample-idle
  namespace: default
  labels:
    app.kubernetes.io/name: cpu-idle-sample
  annotations:
    cpu.azalio.net/tier: idle
spec:
  restartPolicy: Never
  containers:
    - name: workload
      image: busybox:1.36
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      resources:
        requests:
          cpu: 500m
          memory: 32Mi
