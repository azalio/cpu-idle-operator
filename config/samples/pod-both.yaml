# Sample pod that requests both tiers at once: idle plus burst. Both
# annotations are independent (internal/tier.Desired evaluates them
# separately), so cpu-idle-agent applies cpu.idle=1 and configures
# cpu.max.burst on the same pod cgroup.
apiVersion: v1
kind: Pod
metadata:
  name: sample-both
  namespace: default
  labels:
    app.kubernetes.io/name: cpu-idle-sample
  annotations:
    cpu.azalio.net/tier: idle
    cpu.azalio.net/burst: "true"
spec:
  restartPolicy: Never
  containers:
    - name: workload
      image: busybox:1.36
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      resources:
        requests:
          cpu: 500m
          memory: 32Mi
        limits:
          cpu: "1"
          memory: 64Mi
